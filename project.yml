name: MotionLoop
options:
  bundleIdPrefix: com.motionloop
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: MotionLoop
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  MotionLoop:
    type: application
    platform: iOS
    sources:
      - path: Sources/MotionLoop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simplex0.workit
        PRODUCT_NAME: MotionLoop
    scheme:
      testTargets:
        - MotionLoopTests
      gatherCoverageData: true

  MotionLoopTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/MotionLoopTests
    dependencies:
      - target: MotionLoop
